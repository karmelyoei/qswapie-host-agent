<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Swapie</title>
  <desc id="desc">A cheerful little blue fox with a ticket-shaped striped tail.</desc>
